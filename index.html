let current = 0;
let answers = [];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startQuiz() {
  current = 0;
  answers = [];
  showScreen('quiz');
  renderQuestion();
}
function restart() { startQuiz(); }

function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('progressBar').style.width = ((current) / QUESTIONS.length * 100) + '%';
  document.getElementById('progressCount').textContent = (current + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('qTitle').textContent = q.title;
  const box = document.getElementById('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[current] === i ? ' selected' : '');
    btn.innerHTML = '<span class="tag">' + String.fromCharCode(65 + i) + '</span>' + opt.text;
    btn.onclick = () => chooseOption(i);
    box.appendChild(btn);
  });
}

function chooseOption(i) {
  answers[current] = i;
  document.querySelectorAll('.opt').forEach((el, idx) => { el.classList.toggle('selected', idx === i); });
  setTimeout(() => {
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
    else { finishQuiz(); }
  }, 250);
}

function calcScores() {
  const raw = { adventure:0, loyalty:0, wisdom:0, passion:0, empathy:0 };
  answers.forEach((optIdx, qIdx) => {
    const opt = QUESTIONS[qIdx].options[optIdx];
    if (!opt) return;
    for (const k in opt.scores) raw[k] += opt.scores[k];
  });
  const max = Math.max(...Object.values(raw), 1);
  const out = {};
  DIMENSIONS.forEach(d => { out[d.key] = Math.round(raw[d.key] / max * 100); });
  return out;
}

function matchCharacter(scores) {
  const dist = c => {
    let sum = 0;
    DIMENSIONS.forEach(d => { const diff = scores[d.key] - c.scores[d.key]; sum += diff * diff; });
    return Math.sqrt(sum);
  };
  const sorted = CHARACTERS.slice().sort((a, b) => dist(a) - dist(b));
  const maxDist = Math.sqrt(5 * 100 * 100);
  return { main: sorted[0], others: sorted.slice(1, 3), similarity: Math.round(100 - dist(sorted[0]) / maxDist * 100) };
}

function finishQuiz() {
  const scores = calcScores();
  const { main, others, similarity } = matchCharacter(scores);
  document.getElementById('similarity').textContent = '匹配度 ' + similarity + '%';
  document.getElementById('charName').textContent = main.name;
  document.getElementById('charCrew').textContent = main.crew;
  document.getElementById('charKeywords').innerHTML = main.keywords.map(k => '<span>#' + k + '</span>').join('');
  document.getElementById('scoreList').innerHTML = DIMENSIONS.map(d => '<div class="score-item"><span>' + d.label + '</span><div class="track"><div class="fill" style="width:' + scores[d.key] + '%"></div></div><span class="num">' + scores[d.key] + '</span></div>').join('');
  document.getElementById('careerRole').textContent = main.career.role;
  document.getElementById('careerJobs').innerHTML = main.career.suitableJobs.map(j => '<span>' + j + '</span>').join('');
  document.getElementById('careerStyle').textContent = main.career.workStyle;
  document.getElementById('careerPartner').textContent = main.career.bestPartner;
  document.getElementById('careerAvoid').textContent = main.career.avoid;
  document.getElementById('otherList').innerHTML = others.map(c => '<div class="other-card"><h3>' + c.name + '</h3><p>' + c.crew + '</p><div class="keywords">' + c.keywords.map(k => '<span>#' + k + '</span>').join('') + '</div></div>').join('');
  drawRadar(scores);
  showScreen('result');
}

function drawRadar(scores) {
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2, R = 95;
  const n = DIMENSIONS.length;
  ctx.clearRect(0, 0, W, H);
  const angleAt = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  [0.25, 0.5, 0.75, 1].forEach(scale => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = angleAt(i); const x = cx + Math.cos(a) * R * scale; const y = cy + Math.sin(a) * R * scale;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.strokeStyle = 'rgba(201,168,106,0.4)'; ctx.stroke();
  });
  for (let i = 0; i < n; i++) {
    const a = angleAt(i);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.strokeStyle = 'rgba(201,168,106,0.4)'; ctx.stroke();
  }
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = angleAt(i); const r = scores[DIMENSIONS[i].key] / 100 * R;
    const x = cx + Math.cos(a) * r; const y = cy + Math.sin(a) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fillStyle = 'rgba(192,57,43,0.35)'; ctx.fill();
  ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2; ctx.stroke();
  for (let i = 0; i < n; i++) {
    const a = angleAt(i); const r = scores[DIMENSIONS[i].key] / 100 * R;
    const x = cx + Math.cos(a) * r; const y = cy + Math.sin(a) * r;
    ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#c0392b'; ctx.fill();
  }
  ctx.font = '12px -apple-system, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const a = angleAt(i); const x = cx + Math.cos(a) * (R + 20); const y = cy + Math.sin(a) * (R + 20);
    ctx.fillStyle = '#c9a86a'; ctx.fillText(DIMENSIONS[i].label, x, y);
  }
}
